---
# Runs the Go checks (build, test, lint) on pull requests targeting main and on
# pushes to main, so issues that land on main are surfaced there too.
name: Golang CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: golang-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: namespace-profile-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          cache: |
            go
            mise

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          cache: "false"

      - run: mise run build

  test:
    runs-on: namespace-profile-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          cache: |
            go
            mise

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          cache: "false"

      - run: mise run test

  lint:
    runs-on: namespace-profile-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          path: |
            ~/.cache/golangci-lint
          cache: |
            go
            mise

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          cache: "false"

      - run: mise run lint

  integration:
    runs-on: namespace-profile-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          cache: |
            go
            mise

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          cache: "false"

      - run: mise run test-integration

  docs:
    runs-on: namespace-profile-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          cache: |
            go
            mise

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          cache: "false"

      - run: mise run gen-docs

      - name: Fail if the command reference is stale
        run: |
          if ! git diff --quiet -- docs/reference; then
            echo "docs/reference is out of date; run 'mise run gen-docs' and commit the result." >&2
            git diff -- docs/reference >&2
            exit 1
          fi
